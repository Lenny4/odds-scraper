services:
  node:
    env_file:
      - .env
    build:
      context: .
      target: node_scapper
    restart: unless-stopped
    volumes:
      - ./:/app:rw
      - chromium_browser:/root/.cache/puppeteer/chrome
      - ./docker/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint
    ports:
      - target: ${NODE_API_PORT:-4000}
        published: ${NODE_API_PORT:-4000}
      - target: ${NEXT_PORT:-4001}
        published: ${NEXT_PORT:-4001}
      - target: ${SOCKET_PORT:-4002}
        published: ${SOCKET_PORT:-4002}
      - target: ${LIVE_PORT:-4004}
        published: ${LIVE_PORT:-4004}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - socket

